[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timegnn"
version = "0.1.0"
description = "General-purpose temporal GNN library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "TimeGNN Contributors" }
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1",
    "scikit-learn>=1.3"
]

[project.optional-dependencies]
pyg = [
    "torch-geometric>=2.4",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18"
]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scipy>=1.10",
    "nltk>=3.8",
    "pyxdameraulevenshtein>=1.7.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
