<marker id="m-navy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1d4ed8"/></marker>
<symbol id="knight" viewBox="0 0 100 100"><path d="M22 90 L78 90 L78 80 C78 60 72 50 60 44 C68 38 76 30 76 20 C76 10 66 6 56 8 L50 2 L44 10 C30 14 18 26 14 40 L12 50 L24 56 L34 46 C32 56 28 66 28 80 L22 80 Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/><circle cx="52" cy="22" r="3.6" fill="currentColor"/></symbol>
<symbol id="knight-f" viewBox="0 0 100 100"><path d="M22 90 L78 90 L78 80 C78 60 72 50 60 44 C68 38 76 30 76 20 C76 10 66 6 56 8 L50 2 L44 10 C30 14 18 26 14 40 L12 50 L24 56 L34 46 C32 56 28 66 28 80 L22 80 Z" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><circle cx="54" cy="22" r="4" fill="#1d4e8c"/></symbol>
