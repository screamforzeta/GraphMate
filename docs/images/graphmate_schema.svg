<text x="478" y="86" font-size="46" font-weight="700" fill="#ffffff">GraphMate</text>
<text x="607" y="116" text-anchor="middle" font-size="21" font-weight="600" fill="#dbe9ff">architecture and evaluation overview</text>
<text x="607" y="143" text-anchor="middle" font-size="14.5" fill="#c4d9f5">Graph neural networks for chess puzzle solving, timing-aware move prediction,</text>
<text x="607" y="162" text-anchor="middle" font-size="14.5" fill="#c4d9f5">post-move reranking, and comparison with language models.</text>
