<svg xmlns="http://www.w3.org/2000/svg" width="1214" height="1295" viewBox="0 0 1214 1295" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">GraphMate architecture and evaluation overview</title>
<desc id="d">A chess position is encoded as a 64-square graph, processed by shared GAT components, then evaluated through A3, B, and A4 model paths on Lichess and YACPDB with LLM comparison.</desc>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e3a5f" flood-opacity="0.18"/></filter>
<marker id="m-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#2f7fd1"/></marker>
<marker id="m-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1fa6a6"/></marker>
<marker id="m-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#2f9a5a"/></marker>
